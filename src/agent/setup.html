<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>집포터 로컬 에이전트 설정</title>
  <link rel="stylesheet" href="./setup.css">
</head>
<body>
  <main class="card">
    <header class="card-header">
      <h1>🏠 집포터</h1>
      <p>공인중개사를 위한 로컬 에이전트</p>
    </header>
    <section class="card-body" id="setupPanel">
      <div class="info-box">
        관리자에게 받은 에이전트 연결키를 입력하세요. 서버 주소는 공식 설치파일에 포함된 값만 사용합니다.
      </div>
      <div class="field">
        <label for="agent_key">에이전트 연결키 🔑</label>
        <div class="secret-row">
          <input id="agent_key" type="password" placeholder="예: re_agent_abc123..." autocomplete="new-password" spellcheck="false">
          <button type="button" id="toggleAgentKey" class="toggle" aria-pressed="false">표시</button>
        </div>
        <p class="hint">저장 후 입력창의 연결키는 즉시 지워집니다.</p>
      </div>
      <div class="field">
        <label for="agent_name">에이전트 이름 <span>(선택)</span></label>
        <input id="agent_name" type="text" placeholder="예: 홍길동 중개사무소 PC" autocomplete="off">
      </div>
      <div class="manual-box">
        네이버·YouTube·Instagram 계정 등록과 게시는 각 서비스의 공식 화면에서 직접 진행하세요. 이 앱은 SNS 비밀번호를 입력받지 않습니다.
      </div>
      <p class="error" id="error" role="alert"></p>
      <button type="button" class="primary" id="saveButton">안전하게 저장하고 시작</button>
    </section>
    <section class="card-body hidden" id="donePanel">
      <div class="done-icon">✓</div>
      <h2>설정 완료</h2>
      <p>연결키가 운영체제 보안 저장소에 저장됐으며 에이전트가 백그라운드에서 실행됩니다.</p>
    </section>
  </main>
  <script src="./setup.js"></script>
</body>
</html>
